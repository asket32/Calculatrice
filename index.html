<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Calculator</title>
</head>
<body>
    <div class="Calculator">
        <input type="text" name="resultat" id="resultat" readonly>
        <div class="buttons">
            <button class="effacer">C</button>
            <button class="effacer touts">AC</button>
            <button class="operateur">-</button><br>
            <button class="operateur">+</button>
            <button class="operateur">*</button>
            <button class="operateur">/</button><br>
            <button class="number">7</button>
            <button class="number">8</button>
            <button class="number">9</button><br>
            <button class="number">4</button>
            <button class="number">5</button>
            <button class="number">6</button><br>
            <button class="number">1</button>
            <button class="number">2</button>
            <button class="number">3</button><br>
            <button class="decimal">.</button>
            <button class="number">0</button>
            <button class="equals">=</button>
        </div>
    </div>
    <script src="calcul.js"></script>
</body>
</html>
